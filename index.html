<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MesoForge</title>
<meta name="description" content="Hypertrophy training planner with autoregulated volume, RIR progression, and analytics.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1a19">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div>
    <h1 id="header-title">MesoForge</h1>
    <div class="sub" id="header-sub"></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main>
  <!-- ============ TRAIN (today) ============ -->
  <section class="view" id="view-train"></section>

  <!-- ============ WORKOUT LOGGING ============ -->
  <section class="view" id="view-workout"></section>

  <!-- ============ PLAN (mesocycle) ============ -->
  <section class="view" id="view-plan"></section>

  <!-- ============ LIBRARY ============ -->
  <section class="view" id="view-library"></section>

  <!-- ============ PROGRESS ============ -->
  <section class="view" id="view-progress"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="train" class="active" aria-label="Train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
    Train
  </button>
  <button data-tab="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
    Plan
  </button>
  <button data-tab="library" aria-label="Library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    Library
  </button>
  <button data-tab="progress" aria-label="Progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18"/><path d="M5 17V9M10 17V5M15 17v-7M20 17V8"/></svg>
    Progress
  </button>
</nav>

<div class="modal-scrim" id="modal-scrim">
  <div class="modal" id="modal-body" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
